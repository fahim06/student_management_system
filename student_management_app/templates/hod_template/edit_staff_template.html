{% extends 'hod_template/base_template.html' %}
{% block page_title %}
    Edit Staff | {{ staff.admin.username }}
{% endblock page_title %}
{% block main_content %}

    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="card card-primary card-outline mb-4">
                    <!--begin::Header-->
                    <div class="card-header">
                        <h3 class="card-title"><i class="bi bi-pencil-square me-2"></i>Edit Staff
                            | {{ staff.admin.username }}</h3>
                    </div>
                    <!--end::Header-->
                    <!--begin::Form-->
                    <form role="form" action="{% url 'edit_staff_save' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <!--begin::Body-->
                        <div class="card-body">
                            <input type="hidden" name="staff_id" value="{{ staff.admin.id }}">
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="first_name" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name"
                                           placeholder="Enter first name" value="{{ staff.admin.first_name }}">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label for="last_name" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name"
                                           placeholder="Enter last name" value="{{ staff.admin.last_name }}">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username"
                                           placeholder="Enter username" value="{{ staff.admin.username }}">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label for="email" class="form-label">Email address</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           placeholder="Enter email" value="{{ staff.admin.email }}">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 form-group">
                                    <label for="address" class="form-label">Address</label>
                                    <input type="text" class="form-control" id="address" name="address"
                                           placeholder="Enter address" value="{{ staff.address }}">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label for="profile_pic" class="form-label">Profile Picture</label>
                                    <input type="file" class="form-control" id="profile_pic" name="profile_pic">
                                </div>
                            </div>
                        </div>
                        <!--end::Body-->
                        <!--begin::Footer-->
                        <div class="card-footer text-center">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save-fill me-2"></i>Save
                                Changes
                            </button>
                        </div>
                        <!--end::Footer-->
                    </form>
                    <!--end::Form-->
                </div>
            </div>
        </div>
    </section>

{% endblock main_content %}
