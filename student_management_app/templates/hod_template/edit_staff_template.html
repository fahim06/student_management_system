{% extends 'hod_template/base_template.html' %}
{% block page_title %}
    Edit Staff | {{ staff.admin.username }}
{% endblock page_title %}
{% block main_content %}

    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <form role="form" action="{% url 'edit_staff_save' %}" method="post" enctype="multipart/form-data">
                        <div class="card card-primary card-outline mb-4">
                            {% csrf_token %}
                            <div class="card-header">
                                <div class="d-flex justify-content-between align-items-center">
                                    <h3 class="card-title mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Staff
                                        | {{ staff.admin.username }}</h3>
                                    <div>
                                        <a href="javascript:history.back()" class="btn btn-secondary btn-sm"><i
                                                class="bi bi-arrow-left-circle me-2"></i>Back</a>
                                        <button type="submit" class="btn btn-primary btn-sm ms-2"><i
                                                class="bi bi-save-fill me-2"></i>Save Changes
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="card-body">
                                <input type="hidden" name="staff_id" value="{{ staff.admin.id }}">
                                <div class="row">
                                    <div class="col-md-6 form-group">
                                        <label for="first_name" class="form-label">First Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" id="first_name" name="first_name"
                                                   placeholder="Enter first name" value="{{ staff.admin.first_name }}">
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label for="last_name" class="form-label">Last Name</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" class="form-control" id="last_name" name="last_name"
                                                   placeholder="Enter last name" value="{{ staff.admin.last_name }}">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 form-group">
                                        <label for="username" class="form-label">Username</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                                            <input type="text" class="form-control" id="username" name="username"
                                                   placeholder="Enter username" value="{{ staff.admin.username }}">
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label for="email" class="form-label">Email address</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                                            <input type="email" class="form-control" id="email" name="email"
                                                   placeholder="Enter email" value="{{ staff.admin.email }}">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 form-group">
                                        <label for="address" class="form-label">Address</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
                                            <input type="text" class="form-control" id="address" name="address"
                                                   placeholder="Enter address" value="{{ staff.address }}">
                                        </div>
                                    </div>
                                    <div class="col-md-6 form-group">
                                        <label for="profile_pic" class="form-label">Profile Picture</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-image"></i></span>
                                            <input type="file" class="form-control" id="profile_pic" name="profile_pic">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

{% endblock main_content %}
